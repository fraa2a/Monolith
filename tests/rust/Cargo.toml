[package]
name = "monolith-core-tests"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"], optional = true }
base64 = "0.22"
semver = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
ed25519-dalek = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Security", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_Networking_WinHttp"] }

[features]
default = ["catalogs"]
catalogs = ["dep:rusqlite", "dep:ureq"]
