name: Release on Version Tag

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build and release Monolith
    runs-on: windows-latest

    env:
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      VCPKG_EXE: ${{ github.workspace }}\vcpkg\vcpkg.exe
      FEED_URL: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
      USERNAME: ${{ github.repository_owner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = $tag.TrimStart("v")
          if ($ver -notmatch '^\d+\.\d+\.\d+$') {
            Write-Error "Tag must look like vX.Y.Z, got: $tag"
            exit 1
          }
          "version=$ver" >> $env:GITHUB_OUTPUT

      # Pinned to the builtin-baseline commit in vcpkg.json so dependency
      # versions (FFmpeg DLL ABIs etc.) are reproducible across CI runs.
      - name: Clone vcpkg (pinned)
        shell: pwsh
        run: |
          $sha = (Get-Content vcpkg.json | ConvertFrom-Json).'builtin-baseline'
          git init "$env:VCPKG_ROOT"
          git -C "$env:VCPKG_ROOT" remote add origin https://github.com/microsoft/vcpkg.git
          git -C "$env:VCPKG_ROOT" fetch --depth 1 origin $sha
          git -C "$env:VCPKG_ROOT" checkout FETCH_HEAD

      - name: Bootstrap vcpkg
        shell: pwsh
        run: '& "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics'

      - name: Configure vcpkg binary cache
        shell: pwsh
        run: |
          "VCPKG_BINARY_SOURCES=clear;nuget,$env:FEED_URL,readwrite" >> $env:GITHUB_ENV
          $nuget = (& "$env:VCPKG_EXE" fetch nuget | Select-Object -Last 1)
          & $nuget sources remove -Name GitHubPackages -NonInteractive 2>$null
          & $nuget sources add `
            -Source "$env:FEED_URL" `
            -StorePasswordInClearText `
            -Name GitHubPackages `
            -UserName "$env:USERNAME" `
            -Password "${{ secrets.GITHUB_TOKEN }}" `
            -NonInteractive
          & $nuget setapikey "${{ secrets.GITHUB_TOKEN }}" -Source "$env:FEED_URL" -NonInteractive

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build (Tauri UI)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/desktop-ui/src-tauri

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            app/desktop-ui/package-lock.json
            plugins/stream-deck/package-lock.json

      - name: Ensure Visual Studio Build Tools
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = if (Test-Path $vswhere) {
            & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          }
          if ([string]::IsNullOrWhiteSpace($vs)) {
            choco install visualstudio2022buildtools --no-progress -y --package-parameters "--add Microsoft.VisualStudio.Workload.VCTools --includeRecommended --passive --norestart"
          }

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Ensure Ninja
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja --no-progress -y
          }

      - name: Locate mt.exe (manifest tool)
        shell: pwsh
        run: |
          $mt = Get-ChildItem "$env:VCINSTALLDIR\..\..\..\..\..\Windows Kits\*\bin\*\x64\mt.exe" `
                 -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $mt) {
            $mt = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\*\bin\*\x64\mt.exe" `
                   -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $mt) {
            $mt = Get-ChildItem "$env:ProgramFiles\*\bin\*\x64\mt.exe" `
                   -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if ($mt) {
            "CMAKE_MT=$($mt.FullName)" >> $env:GITHUB_ENV
            Write-Host "Found mt.exe at $($mt.FullName)"
          } else {
            Write-Warning "mt.exe not found -- manifest will be broken!"
          }

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build `
            -G "Ninja Multi-Config" `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" `
            "-DCMAKE_MT:FILEPATH=$env:CMAKE_MT"
          # NOTE: no -DMONOLITH_VERSION from the tag. Engine / ui / updater
          # are versioned independently (CMakeLists project(), the two
          # tauri.conf.json files) so a UI-only release can ship without
          # bumping the engine. The tag only names the release and versions
          # the full installer.

      # The CMake desktop_ui target bundles the Preact frontend (npm/Vite) and
      # compiles the Tauri UI (cargo) into <recorder-output>/ui/Monolith.UI.exe.
      - name: Build Release
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Install Stream Deck plugin dependencies
        shell: pwsh
        working-directory: plugins/stream-deck
        run: npm ci

      - name: Build Stream Deck plugin package
        shell: pwsh
        working-directory: plugins/stream-deck
        run: .\scripts\package-plugin.ps1 -Version "${{ steps.version.outputs.version }}"

      - name: Verify build output
        shell: pwsh
        run: |
          foreach ($f in @(
            "build/app/recorder/Release/Monolith.exe",
            "build/app/recorder/Release/ui/Monolith.UI.exe",
            "build/app/recorder/Release/Updater.exe",
            "build/app/recorder/Release/sqlite3.dll",
            "plugins/stream-deck/dist/Monolith-StreamDeck-${{ steps.version.outputs.version }}.streamDeckPlugin"
          )) {
            if (-not (Test-Path $f)) {
              Write-Error "Build output not found: $f"
              exit 1
            }
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.version }}"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DMonolithVersion=$ver installer\monolith.iss
          if (-not (Test-Path "installer/Output/MonolithSetup-$ver.exe")) {
            Write-Error "Installer was not produced"
            exit 1
          }

      - name: Sign installer and generate appcast
        shell: pwsh
        env:
          WINSPARKLE_ED_PRIVATE_KEY: ${{ secrets.WINSPARKLE_ED_PRIVATE_KEY }}
        run: |
          $ver = "${{ steps.version.outputs.version }}"
          ./scripts/generate-appcast.ps1 `
            -Version $ver `
            -InstallerPath "installer/Output/MonolithSetup-$ver.exe" `
            -InstallerUrl "https://github.com/${{ github.repository }}/releases/download/v$ver/MonolithSetup-$ver.exe" `
            -ReleaseNotesUrl "https://github.com/${{ github.repository }}/releases/tag/v$ver" `
            -PrivateKeyPem $env:WINSPARKLE_ED_PRIVATE_KEY `
            -OutputPath appcast.xml
          # Legacy migration feed only: installs still on the WinSparkle
          # updater read this appcast once and land on the component-updater
          # build; from there update-manifest.json takes over.

      # ── Component update payload ─────────────────────────────────────────
      # Per-component zips + update-manifest.json drive Updater.exe: only the
      # components whose version changed get downloaded by clients.

      - name: Read component versions
        id: compvars
        shell: pwsh
        run: |
          $engine = [regex]::Match((Get-Content CMakeLists.txt -Raw),
              'project\(monolith VERSION ([0-9]+\.[0-9]+\.[0-9]+)').Groups[1].Value
          $ui = (Get-Content app/desktop-ui/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $updater = (Get-Content app/updater/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if (-not $engine -or -not $ui -or -not $updater) {
            Write-Error "Failed to parse component versions (engine='$engine' ui='$ui' updater='$updater')"
            exit 1
          }
          "engine=$engine" >> $env:GITHUB_OUTPUT
          "ui=$ui" >> $env:GITHUB_OUTPUT
          "updater=$updater" >> $env:GITHUB_OUTPUT
          Write-Host "engine=$engine ui=$ui updater=$updater"
          # Sanity: the tag names the release, so it should not sort below any
          # component it ships (legacy WinSparkle clients compare the tag
          # against their engine FileVersion).
          $tag = "${{ steps.version.outputs.version }}"
          foreach ($pair in @(@("engine", $engine), @("ui", $ui), @("updater", $updater))) {
            if ([version]$pair[1] -gt [version]$tag) {
              Write-Warning "tag v$tag is lower than $($pair[0]) version $($pair[1])"
            }
          }

      - name: Package component zips
        shell: pwsh
        run: |
          $rel = "build/app/recorder/Release"
          $pkg = "build/update-pkg"
          Remove-Item -Recurse -Force $pkg -ErrorAction SilentlyContinue

          # engine: exe + codec/sqlite DLLs + config\default-config.json (the
          # config\ subdir structure is preserved inside the zip).
          $eng = "$pkg/engine"
          New-Item -ItemType Directory -Force -Path "$eng/config" | Out-Null
          Copy-Item "$rel/Monolith.exe" $eng
          Copy-Item "$rel/av*.dll" $eng -ErrorAction SilentlyContinue
          Copy-Item "$rel/sw*.dll" $eng -ErrorAction SilentlyContinue
          Copy-Item "$rel/lib*.dll" $eng -ErrorAction SilentlyContinue
          Copy-Item "$rel/sqlite3.dll" $eng
          Copy-Item "config/default-config.json" "$eng/config/"
          Compress-Archive -Path "$eng/*" -DestinationPath "monolith-engine-${{ steps.compvars.outputs.engine }}.zip"

          # ui: the whole ui\ subtree.
          $ui = "$pkg/ui"
          New-Item -ItemType Directory -Force -Path $ui | Out-Null
          Copy-Item "$rel/ui/*" $ui -Recurse
          Compress-Archive -Path "$ui/*" -DestinationPath "monolith-ui-${{ steps.compvars.outputs.ui }}.zip"

          # updater: Updater.exe at the app root.
          $upd = "$pkg/updater"
          New-Item -ItemType Directory -Force -Path $upd | Out-Null
          Copy-Item "$rel/Updater.exe" $upd
          Compress-Archive -Path "$upd/*" -DestinationPath "monolith-updater-${{ steps.compvars.outputs.updater }}.zip"

          Get-ChildItem monolith-*.zip | ForEach-Object { Write-Host "$($_.Name) $([math]::Round($_.Length / 1MB, 1)) MB" }

      - name: Sign components and generate update manifest
        shell: pwsh
        env:
          WINSPARKLE_ED_PRIVATE_KEY: ${{ secrets.WINSPARKLE_ED_PRIVATE_KEY }}
        run: |
          ./scripts/generate-update-manifest.ps1 `
            -EngineVersion  "${{ steps.compvars.outputs.engine }}" `
            -UiVersion      "${{ steps.compvars.outputs.ui }}" `
            -UpdaterVersion "${{ steps.compvars.outputs.updater }}" `
            -EngineZip  "monolith-engine-${{ steps.compvars.outputs.engine }}.zip" `
            -UiZip      "monolith-ui-${{ steps.compvars.outputs.ui }}.zip" `
            -UpdaterZip "monolith-updater-${{ steps.compvars.outputs.updater }}.zip" `
            -BaseUrl    "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}" `
            -Tag        "${{ github.ref_name }}" `
            -NotesUrl   "https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}" `
            -PrivateKeyPem $env:WINSPARKLE_ED_PRIVATE_KEY `
            -OutputPath update-manifest.json

      # GPLv3: the public release must offer the corresponding source.
      - name: Create source archive
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.version }}"
          git archive --format=zip --output "monolith-src-$ver.zip" HEAD

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Monolith ${{ steps.version.outputs.version }}
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            installer/Output/MonolithSetup-*.exe
            appcast.xml
            update-manifest.json
            monolith-engine-*.zip
            monolith-ui-*.zip
            monolith-updater-*.zip
            monolith-src-*.zip
            plugins/stream-deck/dist/*.streamDeckPlugin
          body: |
            Monolith ${{ steps.version.outputs.version }}

            **Install:** download and run `MonolithSetup-${{ steps.version.outputs.version }}.exe` (per-user, no admin needed, no prerequisites).
            Existing installs update automatically via the in-app updater.

            **Components:** engine ${{ steps.compvars.outputs.engine }} · ui ${{ steps.compvars.outputs.ui }} · updater ${{ steps.compvars.outputs.updater }} — clients download only what changed.

            **Stream Deck:** `Monolith-StreamDeck-${{ steps.version.outputs.version }}.streamDeckPlugin`

            **Source:** `monolith-src-${{ steps.version.outputs.version }}.zip` (GPLv3 corresponding source).
